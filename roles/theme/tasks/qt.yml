- name: Create qt5ct folder
  ansible.builtin.file:
    state: directory
    dest: "{{ play_user_config_dir }}/qt5ct"
    owner: "{{ play_user }}"
    group: "{{ play_user }}"
    mode: "{{ perm_folders }}"

- name: Copy qt5 config
  ansible.builtin.copy:
    backup: true
    src: qt5ct.conf
    dest: "{{ play_user_config_dir }}/qt5ct/qt5ct.conf"
    owner: "{{ play_user }}"
    group: "{{ play_user }}"
    mode: "{{ perm_files }}"

- name: Copy hyprqt6engine config
  ansible.builtin.copy:
    backup: true
    src: hyprqt6engine.conf
    dest: "{{ play_user_config_dir }}/hypr/hyprqt6engine.conf"
    owner: "{{ play_user }}"
    group: "{{ play_user }}"
    mode: "{{ perm_files }}"
