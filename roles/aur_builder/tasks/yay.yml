- name: Ensure yay-bin build directory exists
  become: true
  become_user: "{{ play_user }}"
  ansible.builtin.file:
    path: "{{ aur_builder_yay_build_dir }}"
    state: directory
    mode: "0755"

- name: Download yay-bin PKGBUILD
  become: true
  become_user: "{{ play_user }}"
  ansible.builtin.get_url:
    url: "https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=yay-bin"
    dest: "{{ aur_builder_yay_build_dir }}/PKGBUILD"
    mode: "0644"
    force: true

- name: Build yay-bin with makepkg
  tags: skip_ansible_lint
  become: true
  become_user: "{{ play_user }}"
  ansible.builtin.command:
    chdir: "{{ aur_builder_yay_build_dir }}"
    cmd: "makepkg -sf --noconfirm"

- name: Find built yay-bin package
  ansible.builtin.find:
    paths: "{{ aur_builder_yay_build_dir }}"
    patterns: "yay-bin-*.pkg.tar.zst"
    recurse: false
  register: aur_builder_yay_packages

- name: Install yay-bin package
  community.general.pacman:
    name: "{{ item.path }}"
    state: present
  loop: "{{ aur_builder_yay_packages.files }}"
