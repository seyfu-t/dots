- name: Install docker and compose
  community.general.pacman:
    name:
      - docker
      - docker-compose

- name: Enable docker daemon
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Create root-owned Compose project directory
  ansible.builtin.file:
    path: /srv/searxng
    state: directory
    mode: "0755"
    owner: root
    group: root

# The image manages ownership of its configuration volume.
- name: Create configuration directory
  ansible.builtin.file:
    path: /srv/searxng/config
    state: directory
    mode: "0755"

- name: Copy compose file
  ansible.builtin.copy:
    backup: true
    src: compose.yml
    dest: /srv/searxng/compose.yml
    mode: "0644"
    owner: root
    group: root

- name: Start docker-compose
  community.docker.docker_compose_v2:
    project_src: /srv/searxng
    files:
      - compose.yml
    state: present
    recreate: auto
