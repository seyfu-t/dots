play_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
# This repository provisions localhost; resolve the account's real home even under sudo.
play_user_home: "{{ ('~' ~ play_user) | expanduser }}"
play_user_use_env: "{{ play_user == lookup('env', 'USER') }}"
play_user_config_dir: >-
  {{ (lookup('env', 'XDG_CONFIG_HOME') if play_user_use_env else '')
     | default(play_user_home ~ '/.config', true) }}
play_user_data_dir: >-
  {{ (lookup('env', 'XDG_DATA_HOME') if play_user_use_env else '')
     | default(play_user_home ~ '/.local/share', true) }}
play_user_cache_dir: >-
  {{ (lookup('env', 'XDG_CACHE_HOME') if play_user_use_env else '')
     | default(play_user_home ~ '/.cache', true) }}
play_user_state_dir: >-
  {{ (lookup('env', 'XDG_STATE_HOME') if play_user_use_env else '')
     | default(play_user_home ~ '/.local/state', true) }}
