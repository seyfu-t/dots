- name: Install fish and fisher
  community.general.pacman:
    state: present
    name:
      - fish
      - fisher

- name: Read installed Fisher plugins
  become: true
  become_user: "{{ play_user }}"
  ansible.builtin.command:
    cmd: fish -c "fisher list"
  register: fish_fisher_plugins
  changed_when: false

- name: Install Tide
  become: true
  become_user: "{{ play_user }}"
  ansible.builtin.command:
    cmd: fish -c "fisher install IlanCosman/tide@v6"
  when: "'IlanCosman/tide' not in fish_fisher_plugins.stdout_lines"

- name: Check whether Tide has been configured
  ansible.builtin.stat:
    path: "{{ play_user_state_dir }}/dots-tide-configured"
  register: fish_tide_configured

- name: Configure Tide
  become: true
  become_user: "{{ play_user }}"
  ansible.builtin.command:
    cmd: >
      fish -c "tide configure
      --auto
      --style=Lean
      --prompt_colors='True color'
      --show_time='24-hour format'
      --lean_prompt_height='Two lines'
      --prompt_connection=Dotted
      --prompt_connection_andor_frame_color=Dark
      --prompt_spacing=Sparse
      --icons='Many icons'
      --transient=Yes"
  when: not fish_tide_configured.stat.exists

- name: Record Tide configuration
  ansible.builtin.copy:
    content: "1\n"
    dest: "{{ play_user_state_dir }}/dots-tide-configured"
    owner: "{{ play_user }}"
    group: "{{ play_user }}"
    mode: "{{ perm_files }}"
    force: false
