- name: Install Rofi runtime dependencies
  community.general.pacman:
    state: present
    name:
      - hyprland
      - papirus-icon-theme
      - procps-ng
      - rofi
      - wmctrl

- name: Create config folder
  ansible.builtin.file:
    dest: "{{ play_user_config_dir }}/rofi"
    owner: "{{ play_user }}"
    group: "{{ play_user }}"
    mode: "{{ perm_folders }}"
    state: directory

- name: Copy config
  ansible.builtin.copy:
    backup: true
    src: rofi/
    dest: "{{ play_user_config_dir }}/rofi"
    owner: "{{ play_user }}"
    group: "{{ play_user }}"
    mode: preserve
    directory_mode: "{{ perm_folders }}"
