- name: Ensure systemd-networkd config directory exists
  ansible.builtin.file:
    path: /etc/systemd/network
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Enable magic packets in systemd
  ansible.builtin.template:
    src: 50-wakeonlan.link.j2
    dest: /etc/systemd/network/50-wakeonlan.link
    mode: "0644"
    owner: root
    group: root
