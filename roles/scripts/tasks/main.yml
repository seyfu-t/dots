- name: Install DDC script dependencies
  community.general.pacman:
    state: present
    name:
      - ddcutil
      - nushell

- name: Activate i2c-dev module
  community.general.modprobe:
    state: present
    name: i2c-dev
    persistent: present

- name: Copy ddc script to local bin
  ansible.builtin.copy:
    backup: true
    src: ddc.nu
    dest: /usr/local/bin/ddc.nu
    mode: "0755"
    owner: root
    group: root
