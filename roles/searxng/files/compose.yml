services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - SEARXNG_SETTINGS_YAML=/etc/searxng/settings.yml
    volumes:
      - /srv/searxng/config:/etc/searxng
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
