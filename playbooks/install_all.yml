- name: Install all dotfiles
  become: true
  hosts: all

  pre_tasks:
    - name: Refuse execution through sudo
      ansible.builtin.assert:
        that:
          - play_user != "root"
          - lookup('env', 'SUDO_USER') | length == 0
        fail_msg: >-
          Run ansible-playbook as the desktop user and let Ansible handle privilege escalation with --ask-become-pass.
  roles:
    - basics
    - devel
    - fish
    - grub
    - hyprland
    - scripts
    - pkg
    - wakeonlan
