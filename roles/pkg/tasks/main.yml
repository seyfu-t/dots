- name: Install packages
  community.general.pacman:
    state: present
    name: "{{ pkg_pacman }}"

- name: Install AUR packages
  ansible.builtin.include_role:
    name: aur_builder
  vars:
    aur_builder_packages: "{{ pkg_aur }}"

- name: Install flatpaks
  become: true
  become_user: "{{ play_user }}"
  community.general.flatpak:
    state: present
    method: user
    name: "{{ pkg_flatpak }}"
